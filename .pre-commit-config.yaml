# pre-commit for sap-fiori — static UI5, no build, no backend
# install: pipx install pre-commit  OR  brew install pre-commit
#          pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-json
      - id: pretty-format-json
        args: [--autofix, --no-sort-keys]
        files: ^data/.*\.json$
      - id: check-xml
        files: \.view\.xml$|\.fragment\.xml$
      - id: check-yaml
        files: ^docker-compose\.yml$
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=500"]
      # uncomment to block direct pushes to main (PR workflow)
      # - id: no-commit-to-branch
      #   args: [--branch=main, --branch=master]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: ^scripts/.*\.sh$
        args: [-x, -S, warning]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, css, html, json, yaml, markdown]
        exclude: ^(resources/|data/) # vendored UI5 + fixture data not formatted
        args: [--ignore-unknown]
        # requires node; hook auto-fetches prettier. Skip with SKIP=prettier if no node.

  # Optional: uncomment when you add package.json + eslint
